name: Test custom retention days
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create static site directory
        run: |
          mkdir -p dist
          echo "<html><body>Retention Test</body></html>" > dist/index.html
          echo "Custom retention days test" > dist/readme.txt

      - id: action
        uses: .
        with:
          name: pages-retention-test
          path: dist/
          retention-days: "7"

      - name: Assert artifact_id is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.artifact_id }}
        run: |
          echo "actual artifact_id: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected artifact_id to be non-empty when using custom retention-days"
            exit 1
          fi
          echo "PASS: artifact_id=$ACTUAL"
